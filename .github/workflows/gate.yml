name: gate
on: [push, pull_request]
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: unit, page and policy tests (the kernels, the page's wiring, its CSP)
        run: node --test test/*.test.mjs
      - name: mutation gate over the kernels (no unreviewed survivors)
        run: node witness-all.mjs
      - name: organ 1's measurement re-runs and must reproduce the committed record byte for byte
        run: node tools/measure.mjs --check
      - name: the record is re-judged by the sealed rules and must reproduce the committed verdict
        run: node tools/judge.mjs --check
      - name: the seal came first, and the record was made on exactly the code it pinned
        run: node tools/order.mjs
      - name: the page's security policy pins exactly its scripts
        run: node tools/csp.mjs --check
      - name: organ 3 — the gate's red-team battery re-runs and must reproduce its record byte for byte
        run: node tools/measure-3.mjs --check
      - name: organ 3 — re-judged by its sealed rules, and its seal came first
        run: node tools/judge-3.mjs --check && node tools/order.mjs --organ 3
      - name: organ 4 — blind evolution re-runs and must reproduce its record byte for byte
        run: node tools/measure-4.mjs --check
      - name: organ 4 — re-judged by its sealed rules (its two failed predictions included), and its seal came first
        run: node tools/judge-4.mjs --check && node tools/order.mjs --organ 4
      - name: organ 4, second design — re-runs, re-judged (its failed predictions included), seal first
        run: node tools/measure-4b.mjs --check && node tools/judge-4b.mjs --check && node tools/order.mjs --organ 4b
      - name: organ 5 — breeding and the card re-run, re-judged, and the seal came first
        run: node tools/measure-5.mjs --check && node tools/judge-5.mjs --check && node tools/order.mjs --organ 5
      - name: organ 6 — recycled work re-counted (byte for byte), re-judged against its committed timing, seal first
        run: node tools/measure-6.mjs --check && node tools/judge-6.mjs --check && node tools/order.mjs --organ 6
      - name: organ 7 — the self-model re-run, re-judged, seal first
        run: node tools/measure-7.mjs --check && node tools/judge-7.mjs --check && node tools/order.mjs --organ 7
      - name: organ 8 — the mesh re-run (every signed message), re-judged, seal first
        run: node tools/measure-8.mjs --check && node tools/judge-8.mjs --check && node tools/order.mjs --organ 8
      - name: organ 8b — the fair learning test re-run, re-judged (its failed premise kept), seal first
        run: node tools/measure-8b.mjs --check && node tools/judge-8b.mjs --check && node tools/order.mjs --organ 8b
      - name: organ 8c — the over-claimer test re-run, re-judged (its failed predictions included), seal first
        run: node tools/measure-8c.mjs --check && node tools/judge-8c.mjs --check && node tools/order.mjs --organ 8c
      - name: organ 9 — the immune system under three attacks, re-run and re-judged (its failed predictions included), seal first
        run: node tools/measure-9.mjs --check && node tools/judge-9.mjs --check && node tools/order.mjs --organ 9
      - name: organ 9b — the behaviour watch by channel, re-run and re-judged, seal first
        run: node tools/measure-9b.mjs --check && node tools/judge-9b.mjs --check && node tools/order.mjs --organ 9b
      - name: organ 10 — alignment, first audit, re-run and re-judged (its failed predictions included), seal first
        run: node tools/measure-10.mjs --check && node tools/judge-10.mjs --check && node tools/order.mjs --organ 10
      - name: organ 10b — the audit at three scales, re-run and re-judged, seal first
        run: node tools/measure-10b.mjs --check && node tools/judge-10b.mjs --check && node tools/order.mjs --organ 10b
      - name: organ 11 — the full season re-run; its verdict is RED on K2 as sealed (an over-broad property, said on the page) — CI checks that exact verdict reproduces, and fails on any drift
        run: node tools/measure-11.mjs --check && out=$(node tools/judge-11.mjs --check || true) && echo "$out" && ! echo "$out" | grep -q 'VERDICT DRIFT' && echo "$out" | grep -q '^RED · K2, K5, K7 failed as sealed' && node tools/order.mjs --organ 11
      - name: organ 11b — the memory’s guarantee stated exactly, re-run and re-judged, seal first
        run: node tools/measure-11b.mjs --check && node tools/judge-11b.mjs --check && node tools/order.mjs --organ 11b
      - name: receipt (a), night 1 — re-run and re-judged (its failed prediction included), seal first
        run: node tools/night.mjs run 1 --check && (node tools/night.mjs judge 1 --check || true) | tee night1.txt && grep -q "^JUDGED · night 1" night1.txt && ! grep -q "VERDICT DRIFT" night1.txt && node tools/order.mjs --organ night-1
      - name: receipt (b), the checker — on the instrument check two browser tabs made (one machine, not two devices)
        run: node tools/receipt-b.mjs data/receipts/instrument-check-two-tabs-one-machine.json
